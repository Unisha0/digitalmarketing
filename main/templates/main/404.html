{% extends 'main/base.html' %}
{% block title %}Page Not Found | Trend Crafters Global{% endblock %}
{% block content %}
<section class="relative pt-40 pb-24 text-center bg-surface overflow-hidden">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-gradient-to-br from-brand-100 via-brand-50 to-transparent rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-gradient-to-tr from-pink-100 via-pink-50 to-transparent rounded-full blur-3xl"></div>
    </div>
    <div class="content-container relative z-10">
        <h1 class="font-display text-7xl sm:text-8xl font-semibold gradient-text mb-4">404</h1>
        <p class="text-xl text-ink-muted mb-8">Sorry, the page you're looking for doesn't exist.</p>
        <a href="{% url 'index' %}" class="btn-primary">Go Home</a>
    </div>
</section>
{% endblock %}
