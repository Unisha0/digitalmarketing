# HTTP: certbot adds the HTTPS server block and redirect (sudo certbot --nginx).
# Everything ends up on https://trendcrafters.global (www redirects to the apex domain).
upstream trendcrafters_app {
    server unix:/run/gunicorn-trendcrafters/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name trendcrafters.global www.trendcrafters.global;

    # one canonical host for SEO
    if ($host = www.trendcrafters.global) { return 301 https://trendcrafters.global$request_uri; }

    client_max_body_size 5m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # WhiteNoise would also serve these, but nginx is faster and can set long cache headers.
    location /static/ {
        alias /home/ubuntu/trendcrafters/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://trendcrafters_app;
    }
}
